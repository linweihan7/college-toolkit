name: CI

# Build + typecheck + test the Vite app on every push to the migration branch.
# This is the verification loop while the app is developed without a local Node
# toolchain. It does NOT deploy — the live GitHub Pages site (served from main's
# root index.html) is untouched.
on:
  push:
    branches: [vite-migration]
  pull_request:
    branches: [vite-migration]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm install (not ci): no lock file is committed yet, so the first CI run
      # resolves and would generate one. Deterministic installs come once a
      # package-lock.json is committed.
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
